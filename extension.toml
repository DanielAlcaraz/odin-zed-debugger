id = "odin-debugger"
name = "Odin Debugger"
version = "0.2.0"
schema_version = 1
authors = ["Daniel Alcaraz"]
description = "Cross-platform Debug Adapter Protocol support for Odin programming language with LLDB, GDB, and CodeLLDB"
repository = "https://github.com/DanielAlcaraz/zed-odin-debugger"
homepage = "https://github.com/DanielAlcaraz/zed-odin-debugger"

[debug_adapters.odin-gdb]
schema_path = "debug_adapter_schemas/odin-gdb.json"

[debug_adapters.odin-lldb]
schema_path = "debug_adapter_schemas/odin-lldb.json"

[debug_adapters.odin-codelldb]
schema_path = "debug_adapter_schemas/odin-codelldb.json"
